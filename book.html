<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5a0610">
  <title>Book an Event · Sherrif's</title>
  <meta name="description" content="Book Sherrif's to cater your event, party, wedding or funeral.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-book">
  <header class="topbar">
    <a href="index.html" class="logo">Sherrif's</a>
    <nav class="desk-nav">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu &amp; Order</a>
      <a href="book.html" aria-current="page">Book an Event</a>
      <a href="tel:+233535815707" class="btn btn-yellow btn-sm">053 581 5707</a>
    </nav>
  </header>

  <main>
    <section class="page-head page-head-photo" style="--bg:url(images/waakye-leaf.jpg)">
      <p class="eyebrow">Catering</p>
      <h1>Book us for your event</h1>
      <p>Events · Parties · Weddings · Funerals</p>
    </section>

    <section class="section section-tight">
      <form id="book-form" class="card card-light" novalidate>
        <fieldset class="event-pick">
          <legend>Type of event</legend>
          <label><input type="radio" name="event" value="Event" required><span>🎉<br>Event</span></label>
          <label><input type="radio" name="event" value="Party"><span>🥳<br>Party</span></label>
          <label><input type="radio" name="event" value="Wedding"><span>💍<br>Wedding</span></label>
          <label><input type="radio" name="event" value="Funeral"><span>🕊️<br>Funeral</span></label>
        </fieldset>

        <div class="two-col">
          <label>Date
            <input name="date" type="date" required>
          </label>
          <label>Number of guests
            <input name="guests" type="number" min="1" inputmode="numeric" required>
          </label>
        </div>

        <fieldset class="checks">
          <legend>Dishes you want</legend>
          <label><input type="checkbox" name="dishes" value="Hot & Spicy Waakye" checked> Hot &amp; Spicy Waakye</label>
          <label><input type="checkbox" name="dishes" value="Jollof Rice"> Jollof Rice</label>
          <label><input type="checkbox" name="dishes" value="Plain Rice"> Plain Rice</label>
        </fieldset>

        <label>Your name
          <input name="name" type="text" required autocomplete="name">
        </label>
        <label>Phone number
          <input name="phone" type="tel" required autocomplete="tel">
        </label>
        <label>Event location
          <input name="location" type="text" required>
        </label>
        <label>Notes (optional)
          <textarea name="notes" rows="2"></textarea>
        </label>

        <p class="form-error" id="book-error" role="alert"></p>
        <button type="submit" class="btn btn-red btn-lg btn-block">Send booking on WhatsApp</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <a class="footer-item" href="tel:+233535815707">
      <span class="footer-label">Call to order</span>
      <strong>053 581 5707</strong>
    </a>
    <div class="footer-item">
      <span class="footer-label">Find us at</span>
      <strong>Anyinam Zongo</strong>
      <span>Near the Islamic JHS</span>
    </div>
  </footer>

  <nav class="tabbar" aria-label="Main">
    <a href="index.html"><span>🏠</span>Home</a>
    <a href="menu.html"><span>🍛</span>Menu</a>
    <a href="book.html" aria-current="page"><span>📅</span>Book</a>
    <a href="tel:+233535815707"><span>📞</span>Call</a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
